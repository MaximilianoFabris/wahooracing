<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc"><title id="title">FOUR LAYERS OF EVIDENCE</title><desc id="desc">Accepted nominal software and checked relocation are separate from actual CAD integration and physical validation. This is an evidence map, not a promised sequence or completed digital twin.</desc><style>text{font-family:Barlow,Arial,sans-serif;fill:#b6c0ca}.heading{font-family:Barlow Condensed,Arial,sans-serif;font-size:34px;fill:#f2f2f3}.label{font-size:28px;fill:#f2f2f3}.small{font-size:23px}.status{font-size:24px;fill:#94bce3}.line{fill:none;stroke:#94bce3;stroke-width:2}.future{fill:none;stroke:#769fc2;stroke-width:2;stroke-dasharray:7 7}.rule{fill:none;stroke:#33404c;stroke-width:1}.curve{fill:none;stroke:#24b8ff;stroke-width:2.5}.dot{fill:#94bce3}</style><text x="30" y="48" class="heading" text-anchor="start">FOUR LAYERS OF EVIDENCE</text><text x="30" y="90" class="small" text-anchor="start">Evidence status changes only when the corresponding work is tested.</text><text x="35" y="157" class="status" text-anchor="start">01</text><text x="105" y="157" class="label" text-anchor="start">Nominal software</text><text x="105" y="195" class="status" text-anchor="start">ACCEPTED</text><text x="105" y="229" class="small" text-anchor="start">Equations, units, volume semantics and result records</text><path class="rule" d="M35 248H850V248"/><text x="35" y="285" class="status" text-anchor="start">02</text><text x="105" y="285" class="label" text-anchor="start">Relocation + preservation</text><text x="105" y="323" class="status" text-anchor="start">CHECKED</text><text x="105" y="357" class="small" text-anchor="start">Same regression repeated; storage checks passed</text><path class="rule" d="M35 376H850V376"/><text x="35" y="413" class="status" text-anchor="start">03</text><text x="105" y="413" class="label" text-anchor="start">Actual CAD connection</text><text x="105" y="451" class="status" text-anchor="start">NOT DEMONSTRATED</text><text x="105" y="485" class="small" text-anchor="start">Rhino roundtrip and assembly mapping remain open</text><path class="rule" d="M35 504H850V504"/><text x="35" y="541" class="status" text-anchor="start">04</text><text x="105" y="541" class="label" text-anchor="start">Physical engine behaviour</text><text x="105" y="579" class="status" text-anchor="start">NOT VALIDATED</text><text x="105" y="613" class="small" text-anchor="start">Measured geometry, combustion, power and temperatures</text><text x="30" y="715" class="small" text-anchor="start">Passing an earlier layer does not validate the layers below it.</text></svg>