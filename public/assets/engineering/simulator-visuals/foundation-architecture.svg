<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" role="img" aria-labelledby="title desc"><title id="title">THE FOUNDATION AND THE CONNECTIONS</title><desc id="desc">Evidence architecture, not a hardware or software deployment diagram. Accepted Python scope is distinct from future Rhino, physics and measurement connections.</desc><style>text{font-family:Barlow,Arial,sans-serif;fill:#b6c0ca}.heading{font-family:Barlow Condensed,Arial,sans-serif;font-size:34px;fill:#f2f2f3}.label{font-size:28px;fill:#f2f2f3}.small{font-size:23px}.status{font-size:24px;fill:#94bce3}.line{fill:none;stroke:#94bce3;stroke-width:2}.future{fill:none;stroke:#769fc2;stroke-width:2;stroke-dasharray:7 7}.rule{fill:none;stroke:#33404c;stroke-width:1}.curve{fill:none;stroke:#24b8ff;stroke-width:2.5}.dot{fill:#94bce3}</style><text x="30" y="48" class="heading" text-anchor="start">THE FOUNDATION AND THE CONNECTIONS</text><text x="30" y="90" class="small" text-anchor="start">One owned foundation. Explicit limits for each future connection.</text><text x="60" y="165" class="status" text-anchor="start">SOURCE + UNITS</text><text x="60" y="207" class="label" text-anchor="start">Frozen geometry inputs</text><text x="60" y="243" class="small" text-anchor="start">Revision and evidence status</text><path class="rule" d="M60 270H835V270"/><text x="60" y="325" class="status" text-anchor="start">DEMONSTRATED SOFTWARE</text><text x="60" y="369" class="label" text-anchor="start">Python kinematics + validation</text><text x="60" y="405" class="small" text-anchor="start">Cold nominal geometry · deterministic records</text><path class="rule" d="M60 435H835V435"/><path class="future" d="M180 466V505M450 466V505M730 466V505"/><text x="180" y="550" class="label" text-anchor="middle">Rhino geometry</text><text x="450" y="550" class="label" text-anchor="middle">Physics backends</text><text x="730" y="550" class="label" text-anchor="middle">Measurements</text><text x="180" y="587" class="small" text-anchor="middle">Actual link not run</text><text x="450" y="587" class="small" text-anchor="middle">Integration proposed</text><text x="730" y="587" class="small" text-anchor="middle">Calibration future</text><text x="30" y="650" class="small" text-anchor="start">Dashed connections are future work; no coupled twin is demonstrated.</text></svg>