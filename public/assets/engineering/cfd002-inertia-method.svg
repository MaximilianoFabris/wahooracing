<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title"><title id="title">Provisional inertia combines the hull distribution and mass locations, with intrinsic contributions still unknown</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#24b8ff" stroke-width="1.5"/></marker></defs><g font-family="Arial,sans-serif" fill="#eef3f6"><text x="45" y="52" font-size="22" fill="#24b8ff">CFD-002 / PROVISIONAL INERTIA</text><text x="45" y="130" font-size="28">Hull mass distribution</text><text x="45" y="165" font-size="19" fill="#97a6b0">Existing surfaces and accepted regional masses</text><text x="45" y="235" font-size="28">Component and allowance locations</text><text x="45" y="270" font-size="19" fill="#97a6b0">Point-mass representation at accepted centres</text><path d="M580 150L660 215M580 270L660 215H715" fill="none" stroke="#24b8ff" stroke-width="2" marker-end="url(#arrow)"/><text x="735" y="200" font-size="29">Iyy ≈ 1.5873</text><text x="735" y="235" font-size="21">kg·m²</text><path d="M45 330H955" stroke="#50616d"/><text x="45" y="380" font-size="24">Unknown intrinsic contributions are omitted.</text><text x="45" y="420" font-size="20" fill="#97a6b0">They remain an uncertainty in the dynamic response.</text><text x="45" y="475" font-size="18" fill="#97a6b0">Model input · not a measured completed-board property</text></g></svg>