<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450"><title>Rev06 component relocation decision schematic</title><desc>Tank moves to the opposite side; battery and ECU move to the former tank area. Starter stays at Rev04. Diagram is not to scale and does not show hull geometry.</desc><g fill="none" stroke="#94bce3" stroke-width="2"><path d="M80 225H920" stroke-dasharray="8 6"/><rect x="400" y="60" width="190" height="90"/><rect x="400" y="285" width="100" height="80"/><rect x="520" y="285" width="80" height="80"/><rect x="125" y="180" width="170" height="80"/><path d="M620 130Q780 220 620 300"/><path d="M375 300Q305 220 375 125"/></g><g fill="#eef3f6" font-family="Arial,sans-serif" text-anchor="middle"><text x="500" y="28" font-size="23">Rev06 / Service access drives the layout</text><text x="495" y="110" font-size="21">Tank</text><text x="495" y="172" font-size="16">Opposite side of hull</text><text x="450" y="333" font-size="18">Battery</text><text x="560" y="333" font-size="18">ECU</text><text x="500" y="391" font-size="16">Former tank area</text><text x="210" y="216" font-size="19">Starter</text><text x="210" y="242" font-size="15">Rev04 retained</text><text x="500" y="435" font-size="15">Decision schematic · not to scale · extraction and fit unverified</text></g></svg>