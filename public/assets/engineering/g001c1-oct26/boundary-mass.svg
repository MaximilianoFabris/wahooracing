<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">A change upstream reaches the exhaust.</title><desc id="desc">Exact accepted boundary masses rounded to three decimals; bars share a zero origin and 250 mg full range. G001-01 versus G001-05. No performance ranking.</desc><g font-family="DejaVu Sans, sans-serif"><text x="80" y="42" font-size="27" text-anchor="start" fill="#b6c0ca">A change upstream reaches the exhaust.</text><text x="80" y="86" font-size="21" text-anchor="start" fill="#b6c0ca">Separate boundary-stream totals over one 20 ms revolution</text><text x="80" y="150" font-size="25" text-anchor="start" fill="#b6c0ca">G001-01</text><text x="80" y="200" font-size="20" text-anchor="start" fill="#b6c0ca">Transfer in</text><path d="M270 190h513.18788" stroke="#24b8ff" stroke-width="20"/><text x="850" y="199" font-size="21" text-anchor="start" fill="#b6c0ca">229.102 mg</text><text x="80" y="260" font-size="20" text-anchor="start" fill="#b6c0ca">Exhaust out</text><path d="M270 250h457.53385" stroke="#d59d61" stroke-width="20"/><text x="850" y="259" font-size="21" text-anchor="start" fill="#b6c0ca">204.256 mg</text><text x="80" y="340" font-size="25" text-anchor="start" fill="#b6c0ca">G001-05</text><text x="80" y="390" font-size="20" text-anchor="start" fill="#b6c0ca">Transfer in</text><path d="M270 380h304.69940" stroke="#24b8ff" stroke-width="20"/><text x="850" y="389" font-size="21" text-anchor="start" fill="#b6c0ca">136.027 mg</text><text x="80" y="450" font-size="20" text-anchor="start" fill="#b6c0ca">Exhaust out</text><path d="M270 440h288.57092" stroke="#d59d61" stroke-width="20"/><text x="850" y="449" font-size="21" text-anchor="start" fill="#b6c0ca">128.826 mg</text><text x="80" y="545" font-size="25" text-anchor="start" fill="#b6c0ca">Same exhaust geometry. Different transfer schedule.</text><text x="80" y="589" font-size="19" text-anchor="start" fill="#b6c0ca">Outward exhaust excludes separately recorded exhaust backflow.</text><text x="80" y="625" font-size="19" text-anchor="start" fill="#b6c0ca">Less flow does not establish better performance.</text></g></svg>