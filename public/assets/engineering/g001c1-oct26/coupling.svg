<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">Geometry changes what happens next.</title><desc id="desc">Conceptual relationships in the accepted dynamic-cylinder model. Not a drawing of engine hardware.</desc><g font-family="DejaVu Sans, sans-serif"><text x="80" y="42" font-size="27" text-anchor="start" fill="#b6c0ca">Geometry changes what happens next.</text><path d="M80 180H920" stroke="#76909f" stroke-opacity=".4"/><text x="80" y="150" font-size="29" text-anchor="start" fill="#94bce3">PORT GEOMETRY</text><text x="470" y="150" font-size="22" text-anchor="start" fill="#b6c0ca">Opening area and timing</text><path d="M80 315H920" stroke="#76909f" stroke-opacity=".4"/><text x="80" y="285" font-size="29" text-anchor="start" fill="#94bce3">GAS FLOW</text><text x="470" y="285" font-size="22" text-anchor="start" fill="#b6c0ca">Mass and energy cross the boundaries</text><path d="M80 450H920" stroke="#76909f" stroke-opacity=".4"/><text x="80" y="420" font-size="29" text-anchor="start" fill="#94bce3">CYLINDER STATE</text><text x="470" y="420" font-size="22" text-anchor="start" fill="#b6c0ca">Pressure and temperature evolve</text><text x="80" y="520" font-size="27" text-anchor="start" fill="#b6c0ca">Flow responds to that evolving state.</text><text x="80" y="570" font-size="21" text-anchor="start" fill="#b6c0ca">Piston motion changes volume and does mechanical work.</text><text x="80" y="620" font-size="18" text-anchor="start" fill="#b6c0ca">Conceptual relationship diagram — no CAD or geometric dimensions.</text></g></svg>