<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title"><title id="title">Setup and checkpoint checks precede complete motion histories and reviewed results</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#24b8ff" stroke-width="1.5"/></marker></defs><g font-family="Arial,sans-serif" fill="#eef3f6"><text x="45" y="52" font-size="22" fill="#24b8ff">CFD-002 / EVIDENCE SEQUENCE</text><path d="M110 150H890" stroke="#24b8ff" stroke-width="2" marker-end="url(#arrow)"/><text x="60" y="125" font-size="22">01</text><text x="300" y="125" font-size="22">02</text><text x="540" y="125" font-size="22">03</text><text x="780" y="125" font-size="22">04</text><text x="60" y="205" font-size="24">Setup</text><text x="300" y="205" font-size="24">Continuity</text><text x="540" y="205" font-size="24">Histories</text><text x="780" y="205" font-size="24">Review</text><text x="60" y="250" font-size="18" fill="#97a6b0">Constraints, mass,</text><text x="60" y="280" font-size="18" fill="#97a6b0">CG and inertia</text><text x="300" y="250" font-size="18" fill="#97a6b0">Checkpoint fields</text><text x="300" y="280" font-size="18" fill="#97a6b0">and motion state</text><text x="540" y="250" font-size="18" fill="#97a6b0">Heave, pitch,</text><text x="540" y="280" font-size="18" fill="#97a6b0">forces and moments</text><text x="780" y="250" font-size="18" fill="#97a6b0">Stability, windows</text><text x="780" y="280" font-size="18" fill="#97a6b0">and limitations</text><text x="45" y="390" font-size="25">A checkpoint PASS is not a performance result.</text><text x="45" y="440" font-size="20" fill="#97a6b0">Reaching the run target does not automatically establish equilibrium.</text></g></svg>